let memoryStore=null;function clone(x){return JSON.parse(JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function readStored(){try{if(typeof localStorage!=='undefined'){const x=localStorage.getItem('programaDiscursosV2');if(x)return JSON.parse(x)}}catch(e){}return memoryStore?clone(memoryStore):null}function load(){const x=readStored();if(x&&typeof x==='object'&&Array.isArray(x.topics)&&Array.isArray(x.speakers)){if(!Array.isArray(x.outings))x.outings=[];if(!Array.isArray(x.visits))x.visits=[];return x}const fresh=clone(INITIAL);fresh.visits=[];return fresh}function save(silent=false){const data=JSON.stringify(state);let saved=false;try{if(typeof localStorage!=='undefined'){localStorage.setItem('programaDiscursosV2',data);saved=localStorage.getItem('programaDiscursosV2')===data}}catch(e){}if(!saved)memoryStore=clone(state);if(!silent)toast(saved?'Cambios guardados':'Cambios guardados en esta sesión')}function topic(n){return state.topics.find(x=>+x.n===+n)}function datesForMonth(y,mi){const first=new Date(y,mi,1);const delta=(6-first.getDay()+7)%7;const last=new Date(y,mi+1,0).getDate();let a=[];for(let day=1+delta;day<=last;day+=7)a.push(new Date(y,mi,day));return a}function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(s){return new Intl.DateTimeFormat('es-CO',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s+'T00:00:00'))}function rows(m){const old=state.schedule[m]||[];return datesForMonth(+state.year,MONTHS.indexOf(m)).map((d,i)=>{const x=old[i]||{};return {date:iso(d),speaker:x.speaker||'',outline:x.outline||'',song:x.song||''}})}function persistMonth(m,r){state.schedule[m]=r;save()}function lastUsed(n){let a=[];MONTHS.forEach(m=>(state.schedule[m]||[]).forEach(x=>{if(+x.outline===+n&&x.date)a.push(x.date)}));state.outings.forEach(x=>{if(+x.outline===+n&&x.date)a.pus function validateImportedState(s){return !!s&&typeof s==='object'&&Number.isFinite(+s.year)&&Array.isArray(s.topics)&&Array.isArray(s.speakers)&&s.schedule&&typeof s.schedule==='object'&&Array.isArray(s.outings)}
function importBackup(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){try{const raw=JSON.parse(reader.result);const incoming=raw&&raw.state?raw.state:raw;if(!validateImportedState(incoming))throw new Error('Formato no válido');if(!confirm('La importación reemplazará los datos actuales por los del respaldo. ¿Deseas continuar?')){input.value='';return}state=clone(incoming);if(!Array.isArray(state.visits))state.visits=[];save(true);closeModal();render();toast('Respaldo importado correctamente')}catch(e){alert('No se pudo importar el respaldo. Verifica que sea un archivo JSON de Programa de Discursos Públicos.')}input.value=''};reader.readAsText(file,'utf-8')}
let deferredInstallPrompt=null;async function installApp(){const e=document.getElementById('installStatus');if(e)e.textContent='La instalación se habilitará en la versión PWA. Esta versión local funciona sin instalación.'}
function editSpeaker(i){const s=i==null?{name:'',phone:'',privilege:'',bosques:[]}:state.speakers[i];modal(i==null?'Nuevo conferenciante':'Editar conferenciante',`<div class="formgrid"><div><label class="label">Nombre</label><input id="sn" class="field" value="${esc(s.name)}"></div><div><label class="label">Teléfono</label><input id="sp" class="field" value="${esc(s.phone)}"></div><div><label class="label">Privilegio</label><input id="sv" class="field" value="${esc(s.privilege)}"></div><div><label class="label">Bosquejos (máx. 6)</label><input id="sb" class="field" value="${esc(s.bosques.join(', '))}"></div></div>`,`<button class="btn primary" onclick="saveSpeaker(${i==null?'null':i})">Guardar</button>`)}function saveSpeaker(i){const s={name:sn.value.trim(),phone:sp.value.trim(),privilege:sv.value.trim(),bosques:sb.value.split(',').map(x=>+x.trim()).filter(n=>n>=1&&n<=194).slice(0,6)};if(!s.name)return;if(i===null)state.speakers.push(s);else state.speakers[i]=s;save();closeModal();render()}
function editTopic(i){const t=i==null?{n:Math.max(...state.topics.map(x=>x.n),0)+1,t:'',notes:''}:state.topics[i];modal(i==null?'Nuevo bosquejo':'Editar bosquejo',`<div><label class="label">Número</label><input id="tn" class="field" type="number" value="${t.n}"></div><div style="margin-top:8px"><label class="label">Tema</label><textarea id="tt" class="field" rows="3">${esc(t.t)}</textarea></div><div style="margin-top:8px"><label class="label">Notas</label><textarea id="tx" class="field" rows="3">${esc(t.notes)}</textarea></div>`,`<button class="btn primary" onclick="saveTopic(${i==null?'null':i})">Guardar</button>`)}function saveTopic(i){const t={n:+tn.value,t:tt.value.trim(),notes:tx.value.trim()};if(!t.n||!t.t)return;if(i===null)state.topics.push(t);else state.topics[i]=t;state.topics.sort((a,b)=>a.n-b.n);save();closeModal();render()}
function chooseProgramType(){modal('¿Qué deseas programar?',`<p class="muted">Selecciona el tipo de actividad que quieres registrar.</p><div class="two"><button class="btn primary" style="padding:18px 12px" onclick="closeModal();editOuting()"><b>🚗 Salida de orador</b><small style="display:block;margin-top:5px;font-weight:400">Orador que sale a otra congregación</small></button><button class="btn" style="padding:18px 12px" onclick="closeModal();editVisit()"><b>🏠 Visita de orador</b><small style="display:block;margin-top:5px;font-weight:400">Orador que visita nuestra congregación</small></button></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button>`)}
function choosePdfType(){modal('¿Qué PDF deseas imprimir?',`<p class="muted">Puedes generar el programa de salidas, el de visitas o un documento que incluya ambos.</p><div class="list"><button class="btn" onclick="closeModal();printOutings()">🚗 <b>Solo salidas</b></button><button class="btn" onclick="closeModal();printVisits()">🏠 <b>Solo visitas</b></button><button class="btn primary" onclick="closeModal();printOutingsAndVisits()">📄 <b>Salidas y visitas</b></button></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button>`)}
function editVisit(i){const x=i==null?{date:'',speaker:'',outline:'',song:'',congregation:''}:state.visits[i];modal(i==null?'Nueva visita':'Editar visita',`<div class="formgrid"><div><label class="label">Fecha de la visita</label><input id="vd" class="field" type="date" value="${esc(x.date)}"></div><div><label class="label">Nombre del orador</label><input id="vs" class="field" list="vlist" value="${esc(x.speaker)}"></div><div><label class="label">N.º de bosquejo</label><input id="vo" class="field" type="number" min="1" max="${state.topics.length}" value="${esc(x.outline)}" oninput="showVisitTopic(this.value)"></div><div class="wide"><label class="label">Tema del bosquejo</label><div id="vtopic" class="data-box" style="margin-top:0">${esc(topic(x.outline)?.t||'Escribe el número para consultar el bosquejo')}</div></div><div><label class="label">Canción</label><input id="vsong" class="field" value="${esc(x.song)}"></div><div><label class="label">Congregación</label><input id="vc" class="field" value="${esc(x.congregation)}"></div></div><datalist id="vlist">${state.speakers.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`,`<button class="btn primary" onclick="saveVisit(${i==null?'null':i})">Guardar</button>`)}
function showVisitTopic(n){const e=document.getElementById('vtopic');if(e)e.textContent=topic(n)?.t||'Ese número no está en la base de datos de bosquejos.'}
function saveVisit(i){const outline=vo.value.trim();if(!vd.value||!vs.value.trim()||!outline||!topic(outline)||!vsong.value.trim()||!vc.value.trim()){toast('Completa la fecha, orador, un bosquejo válido, canción y congregación');return}const x={date:vd.value,speaker:vs.value.trim(),outline,song:vsong.value.trim(),congregation:vc.value.trim()};if(i===null)state.visits.push(x);else state.visits[i]=x;save();closeModal();render()}
function editOuting(i){const x=i==null?{date:'',speaker:'',outline:'',destination:'',phone:''}:state.outings[i];modal(i==null?'Nueva salida':'Editar salida',`<div class="formgrid"><div><label class="label">Fecha</label><input id="od" class="field" type="date" value="${esc(x.date)}"></div><div><label class="label">Orador</label><input id="os" class="field" list="slist" value="${esc(x.speaker)}"></div><div><label class="label">N.º bosquejo</label><input id="oo" class="field" type="number" value="${esc(x.outline)}"></div><div><label class="label">Congregación destino</label><input id="ot" class="field" value="${esc(x.destination)}"></div><div><label class="label">Teléfono</label><input id="op" class="field" value="${esc(x.phone)}"></div></div><datalist id="slist">${state.speakers.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`,`<button class="btn primary" onclick="saveOuting(${i==null?'null':i})">Guardar</button>`)}function saveOuting(i){const x={date:od.value,speaker:os.value.trim(),outline:oo.value,destination:ot.value.trim(),phone:op.value.trim()};if(i===null)state.outings.push(x);else state.outings[i]=x;save();closeModal();render()}
function openPrintWindow(title,html){const w=window.open('','_blank');if(!w){toast('El navegador bloqueó la ventana de impresión');return}w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial;padding:25px;color:#111}h1{font-size:20px}h2{font-size:16px;margin-top:28px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}small{color:#666}</style></head><body>${html}<script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()}
function printMonth(){const r=rows(selectedMonth);openPrintWindow(`${selectedMonth} ${state.year}`,`<h1>PROGRAMA DE DISCURSOS PÚBLICOS – ${selectedMonth} ${state.year}</h1><p>${esc(state.congregation)} · ${esc(state.phone)} · ${esc(state.meeting)}</p><table><tr><th>Fecha</th><th>Orador</th><th>N.º</th><th>Tema</th><th>Canción</th></tr>${r.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.speaker)}</td><td>${esc(x.outline)}</td><td>${esc(topic(x.outline)?.t||'')}</td><td>${esc(x.song)}</td></tr>`).join('')}</table>`) }
function printOutings(){openPrintWindow('Programa de salidas',`<h1>PROGRAMA DE SALIDAS</h1><p>${esc(state.congregation)} · ${state.year}</p><table><tr><th>Fecha</th><th>Orador</th><th>N.º / Tema</th><th>Destino</th><th>Teléfono</th></tr>${state.outings.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.speaker)}</td><td>${esc(x.outline)} · ${esc(topic(x.outline)?.t||'')}</td><td>${esc(x.destination)}</td><td>${esc(x.phone)}</td></tr>`).join('')}</table>`) }
function printVisits(){openPrintWindow('Programa de visitas',`<h1>PROGRAMA DE VISITAS DE ORADORES</h1><p>${esc(state.congregation)} · ${state.year}</p><table><tr><th>Fecha</th><th>Orador</th><th>N.º / Tema</th><th>Canción</th><th>Congregación</th></tr>${state.visits.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.speaker)}</td><td>${esc(x.outline)} · ${esc(topic(x.outline)?.t||'')}</td><td>${esc(x.song)}</td><td>${esc(x.congregation)}</td></tr>`).join('')}</table>`) }
function printOutingsAndVisits(){openPrintWindow('Programa de salidas y visitas',`<h1>PROGRAMA DE SALIDAS Y VISITAS</h1><p>${esc(state.congregation)} · ${state.year}</p><h2>Salidas de oradores</h2><table><tr><th>Fecha</th><th>Orador</th><th>N.º / Tema</th><th>Destino</th><th>Teléfono</th></tr>${state.outings.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.speaker)}</td><td>${esc(x.outline)} · ${esc(topic(x.outline)?.t||'')}</td><td>${esc(x.destination)}</td><td>${esc(x.phone)}</td></tr>`).join('')}</table><h2>Visitas de oradores</h2><table><tr><th>Fecha</th><th>Orador</th><th>N.º / Tema</th><th>Canción</th><th>Congregación</th></tr>${state.visits.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.speaker)}</td><td>${esc(x.outline)} · ${esc(topic(x.outline)?.t||'')}</td><td>${esc(x.song)}</td><td>${esc(x.congregation)}</td></tr>`).join('')}</table>`) }

function init(){try{state=load();render()}catch(err){const a=document.getElementById('app');a.innerHTML='<main style=\"padding:24px;font-family:system-ui\"><h1>Programa de Discursos</h1><p>No se pudo iniciar la aplicación.</p><p style=\"color:#8a3030\">'+esc(err&&err.message||err)+'</p><button onclick=\"location.reload()\">Reintentar</button></main>';console.error(err);if(window.__pdBootError)window.__pdBootError(err)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();</script></body></html>
